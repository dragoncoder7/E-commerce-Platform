name: erp-web

services:
  # ---------- 生产预览：nginx 托管 dist ----------
  # docker compose up -d --build   访问 http://localhost:8080
  erp-web:
    image: erp-web:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        # 后端未就绪时保持 true，前端使用内置 mock 数据
        VITE_USE_MOCK: 'true'
        VITE_API_BASE_URL: '/api'
    container_name: erp-web
    ports:
      - '8080:80'
    environment:
      - TZ=Asia/Shanghai
    extra_hosts:
      # 便于 nginx 反向代理到宿主机后端（Linux 需要 host-gateway）
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ---------- 开发模式：容器内跑 vite dev server ----------
  # docker compose --profile dev up   访问 http://localhost:5173
  erp-web-dev:
    profiles: ['dev']
    image: node:22-alpine
    container_name: erp-web-dev
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    ports:
      - '5173:5173'
    environment:
      - TZ=Asia/Shanghai
      - CHOKIDAR_USEPOLLING=true
    volumes:
      # 源码挂载，node_modules 使用命名卷（不污染宿主机、不跨平台混淆）
      - ./:/app
      - erp_node_modules:/app/node_modules
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  erp_node_modules:
