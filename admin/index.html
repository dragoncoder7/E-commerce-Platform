<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="renderer" content="webkit" />
    <meta name="description" content="云商 ERP · 电商中台管理系统" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M9 21.5 16 9l7 12.5H9Z' fill='white' fill-opacity='.92'/%3E%3C/svg%3E"
    />
    <title>云商 ERP · 电商中台管理系统</title>
    <style>
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
      }
      .app-loading {
        display: flex;
        height: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Microsoft YaHei', sans-serif;
        color: #64748b;
        font-size: 13px;
        letter-spacing: 0.08em;
      }
      .app-loading__logo {
        display: flex;
        height: 52px;
        width: 52px;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        box-shadow: 0 12px 24px -12px rgba(37, 99, 235, 0.9);
      }
      .app-loading__bar {
        height: 3px;
        width: 132px;
        overflow: hidden;
        border-radius: 999px;
        background: #e2e8f0;
      }
      .app-loading__bar::after {
        content: '';
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: #2563eb;
        animation: app-loading-slide 1.1s ease-in-out infinite;
      }
      @keyframes app-loading-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(320%);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-loading">
        <div class="app-loading__logo">
          <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true">
            <path d="M9 21.5 16 9l7 12.5H9Z" fill="#fff" fill-opacity="0.95" />
          </svg>
        </div>
        <div class="app-loading__bar"></div>
        <p>云商 ERP 正在加载…</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
