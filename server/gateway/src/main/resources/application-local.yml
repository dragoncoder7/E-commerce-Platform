server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848  # 连接本地 Docker 的 Nacos
        namespace: public
      config:
        server-addr: localhost:8848
        file-extension: yaml
        namespace: public
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # System 服务路由
        - id: system-service
          uri: lb://system-service
          predicates:
            - Path=/api/system/**
          filters:
            - StripPrefix=2

  # Redis 配置
  data:
    redis:
      host: localhost  # 连接本地 Docker 的 Redis
      port: 6379
      password: redis123456
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# JWT 配置
jwt:
  secret: ecommerce-platform-secret-key-2024-very-long-secret
  expiration: 604800

# 日志配置
logging:
  level:
    root: INFO
    com.ecommerce: DEBUG
    org.springframework.cloud.gateway: DEBUG
