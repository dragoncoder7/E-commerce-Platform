server:
  port: 8080
spring:
  application:
    name: gateway
  config:
    import:
      # 注意：dataId 的扩展名必须与 file-extension 一致（yml，不是 yaml）
      - optional:nacos:${spring.application.name}.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR:127.0.0.1:8848}
        # namespace 必须填命名空间 ID，不是名称；public 的 ID 是空字符串，"public" 也能被识别
        # 默认 public 保证开箱可用；要切 dev 需先在 Nacos 控制台创建 ID=dev 的命名空间
        namespace: ${NACOS_NAMESPACE:public}
        group: DEFAULT_GROUP
        register-enabled: true
      config:
        server-addr: ${SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: DEFAULT_GROUP
        file-extension: yml
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # 系统服务路由
        - id: system-service
          uri: lb://system-service
          predicates:
            - Path=/api/auth/**,/api/menu/**,/api/dashboard/**
          filters:
            - StripPrefix=1
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              -  "*"
            allowed-methods:
              -  "*"
            allowed-headers:
              -  "*"
            allowCredentials: true
            maxAge: 3600
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# JWT 配置
jwt:
  secret: ecommerce-platform-secret-key-for-jwt-token-generation-must-be-at-least-256-bits
  expiration: 7200000

# 白名单（不需要认证的路径）
security:
  whitelist:
    - /api/auth/login
    - /api/auth/logout

# 日志配置
logging:
  level:
    com.ecommerce: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
