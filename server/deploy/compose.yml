name: ecommerce-prod
x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: prod
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ecommerce_system?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
  SPRING_DATASOURCE_USERNAME: ecommerce
  SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
  SPRING_DATA_REDIS_HOST: redis
  SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
  SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
  MEDIA_PATH: /data/media
  JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m -Duser.timezone=Asia/Shanghai
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ecommerce_system
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h127.0.0.1 -u"$$MYSQL_USER" -e "SELECT 1" ecommerce_system >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 40
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  nacos:
    image: nacos/nacos-server:v2.3.0-slim
    restart: unless-stopped
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 256m
    volumes: [nacos_data:/home/nacos/data]
  migrate:
    image: flyway/flyway:10.20.1
    profiles: [tools]
    command: migrate
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/ecommerce_system?allowPublicKeyRetrieval=true&useSSL=false
      FLYWAY_USER: ecommerce
      FLYWAY_PASSWORD: ${DB_PASSWORD}
    volumes: ['../sql/migrations:/flyway/sql:ro']
    depends_on:
      mysql: {condition: service_healthy}
  erp:
    build:
      context: ..
      dockerfile: Dockerfile.service
      args: {MODULE: modules/erp/erp-service}
    restart: unless-stopped
    environment:
      <<: *app-env
      ERP_JWT_SECRET: ${ERP_JWT_SECRET:?Set ERP_JWT_SECRET}
    volumes: [media:/data/media]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      nacos: {condition: service_started}
  store:
    build:
      context: ..
      dockerfile: Dockerfile.service
      args: {MODULE: modules/store/store-service}
    restart: unless-stopped
    environment:
      <<: *app-env
      STORE_JWT_SECRET: ${STORE_JWT_SECRET:?Set STORE_JWT_SECRET}
      STORE_MAIL_MODE: ${STORE_MAIL_MODE:-disabled}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      STORE_MAIL_FROM: ${STORE_MAIL_FROM:-}
    volumes: [media:/data/media]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      nacos: {condition: service_started}
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile.service
      args: {MODULE: gateway}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
      SPRING_DATA_REDIS_HOST: redis
      ERP_SERVICE_URI: http://erp:8081
      STORE_SERVICE_URI: http://store:8082
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m -Duser.timezone=Asia/Shanghai
    depends_on: [erp, store, nacos, redis]
  store-web:
    build:
      context: ../..
      dockerfile: server/deploy/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api/store
        FRONTEND_DIR: web
    restart: unless-stopped
    ports: ['127.0.0.1:3000:80']
    volumes: ['./nginx-spa.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on: [gateway]
  admin-web:
    build:
      context: ../..
      dockerfile: server/deploy/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api/admin
        FRONTEND_DIR: admin
    restart: unless-stopped
    ports: ['127.0.0.1:3001:80']
    volumes: ['./nginx-spa.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on: [gateway]
volumes:
  mysql_data:
  redis_data:
  nacos_data:
  media:
