server:
  port: 8081

spring:
  application:
    name: system-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848  # 连接本地 Docker 的 Nacos
        namespace: public
      config:
        server-addr: localhost:8848
        file-extension: yaml
        namespace: public

  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/ecommerce_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root123456
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000

  # Redis 配置
  data:
    redis:
      host: localhost  # 连接本地 Docker 的 Redis
      port: 6379
      password: redis123456
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.ecommerce.system.domain
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: ecommerce-platform-secret-key-2024-very-long-secret
  expiration: 604800

# 日志配置
logging:
  level:
    root: INFO
    com.ecommerce: DEBUG
    com.ecommerce.system.mapper: DEBUG
